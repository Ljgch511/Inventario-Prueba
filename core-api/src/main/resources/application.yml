server:
  port: 8080

spring:
  application:
    name: globalr-core-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${SPRING_DATASOURCE_USERNAME:globalr_app}
    password: ${SPRING_DATASOURCE_PASSWORD:globalr_dev_pass_2026}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${APP_JWT_SECRET:GlobalR-Inventory-Super-Secure-Prototype-JWT-Key-2026-ChangeInProd}
    expiration-hours: 12
  satellites:
    crypto-url: ${SAT_CRYPTO_URL:http://localhost:8081}
    pdf-url: ${SAT_PDF_URL:http://localhost:8082}
    media-url: ${SAT_MEDIA_URL:http://localhost:8083}
    notify-url: ${SAT_NOTIFY_URL:http://localhost:8084}
